# CruscottoPA — Docker / Podman Compose (anche Portainer git-stack)
#
# Vincoli di deploy (non cambiare senza leggere CLAUDE.md):
#   - Nome file "docker-compose.yml": Portainer git-stack si aspetta questo nome.
#   - Nessun env_file: il clone Portainer non ha .env (gitignored). Ogni variabile
#     è elencata come ${VAR}: in locale Compose la legge da .env, su Portainer
#     dalle "Environment variables" dello stack.
#   - /data è un volume NOMINATO, mai bind mount: Portainer clona il repo in un
#     path per-commit non suo → il bind mount fallisce con "permission denied";
#     con Podman rootless il bind mount richiederebbe anche :Z/:U e uid mapping.
#   - pull_policy: always → il redeploy Portainer scarica sempre l'immagine
#     ghcr.io aggiornata invece di riusare una build locale "dev".
#
# Uso locale:
#   cp .env.example .env
#   docker compose up -d --build     (oppure: podman compose up -d --build)

services:
  cruscottopa:
    image: ghcr.io/comune-di-montesilvano/cruscottopa:latest
    pull_policy: always
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        VERSION_SUFFIX: "-DEV"
    container_name: cruscottopa
    restart: unless-stopped
    ports:
      # Porta > 1024: il container gira non root (Podman rootless incluso).
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - cruscottopa-data:/data
    environment:
      - PORT=${PORT:-8080}
      - DB_PATH=/data/cruscotto.db
      - UPLOAD_DIR=/data/uploads
      - TZ=${TZ:-Europe/Rome}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - GUIDE_REFRESH_HOURS=${GUIDE_REFRESH_HOURS:-6}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - SESSION_SECRET=${SESSION_SECRET}
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - LDAP_HOST=${LDAP_HOST}
      - LDAP_BASE_DN=${LDAP_BASE_DN}
      - LDAP_USER_DN_TEMPLATE=${LDAP_USER_DN_TEMPLATE}
      - LDAP_STARTTLS=${LDAP_STARTTLS:-true}
      - LDAP_TLS_SKIP_VERIFY=${LDAP_TLS_SKIP_VERIFY:-false}
      - LDAP_BIND_DN=${LDAP_BIND_DN}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD}
      - LDAP_REQUIRED_GROUP=${LDAP_REQUIRED_GROUP}
      - LDAP_ADMIN_GROUP=${LDAP_ADMIN_GROUP}
      - ADMIN_USERS=${ADMIN_USERS}
      - NTLM_DOMAIN=${NTLM_DOMAIN}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - OTRS_URL=${OTRS_URL}
      - OTRS_ROUTE_CREATE=${OTRS_ROUTE_CREATE:-/TicketCreate}
      - OTRS_ROUTE_UPDATE=${OTRS_ROUTE_UPDATE:-/TicketUpdate}
      - OTRS_USER=${OTRS_USER}
      - OTRS_PASSWORD=${OTRS_PASSWORD}
      - OTRS_QUEUE=${OTRS_QUEUE}
      - OTRS_FALLBACK_EMAIL=${OTRS_FALLBACK_EMAIL}
    healthcheck:
      test: ["CMD", "/app/cruscottopa", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cruscottopa-data:
