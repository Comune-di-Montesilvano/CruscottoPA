name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Il job legge solo il codice: GITHUB_TOKEN in sola lettura (principio del minimo privilegio).
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race richiede CGO (solo per il race detector: il driver SQLite
      # modernc.org/sqlite è pure-Go e il binario di produzione è CGO_ENABLED=0).
      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test ./... -race -v

      # L'editor dell'admin si costruisce solo in container (stage "editor" del
      # Dockerfile): una PR di Dependabot npm che lo rompe diventa rossa qui.
      - name: Build editor
        run: docker build --target editor .

      # Scan bloccante su dipendenze go.mod/go.sum — coglie CVE note prima
      # ancora di arrivare al build immagine (che scansiona di nuovo,
      # report-only, in release.yml).
      # Trivy si installa da qui: lo install.sh usato da setup-trivy scarica da
      # get.trivy.dev, che dal 2026-11-03 non risolve più (NXDOMAIN). Binario
      # dalle release GitHub con SHA256 fissato: per aggiornarlo cambiare
      # versione e hash (dal file trivy_<ver>_checksums.txt della release).
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          curl -fsSL -o /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/trivy.tar.gz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Trivy scan filesystem dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: ${{ github.workspace }}/.trivyignore
